<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On ⚡ Score Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22d3ee;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #4ade80;
            --error: #f87171;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        /* Utils */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography */
        h1 { font-size: 2rem; font-weight: 700; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
        .text-accent { color: var(--accent); }

        /* Buttons */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn-outline:hover {
            background: rgba(34, 211, 238, 0.1);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
        }

        .btn-ghost:hover {
            color: var(--text-main);
        }

        /* Inputs */
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 1rem;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            min-height: 100px;
        }

        .paste-btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .daily-winner-banner {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), rgba(74, 222, 128, 0.1));
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .logo { font-size: 1.5rem; font-weight: 700; }

        /* Auth Screen */
        .auth-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 50px;
        }

        .auth-toggle {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .auth-toggle-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }

        .auth-toggle-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Dashboard */
        .date-display {
            color: var(--text-dim);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 600;
        }

        .game-status {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-win { background: rgba(74, 222, 128, 0.2); color: var(--success); }
        .status-loss { background: rgba(248, 113, 113, 0.2); color: var(--error); }
        .status-tie { background: rgba(34, 211, 238, 0.2); color: var(--accent); }

        .score-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-badge {
            background-color: rgba(74, 222, 128, 0.1);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .score-waiting {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-style: italic;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* History Redesign */
        .history-date-group {
            margin-bottom: 32px;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .history-date-header {
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-row {
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            display: grid;
            grid-template-columns: 100px 1fr 1fr;
        }

        .history-row:last-child {
            border-bottom: none;
        }

        .history-cell {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .history-cell.game-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            background-color: rgba(255, 255, 255, 0.01);
        }

        .history-cell.score {
            gap: 4px;
        }

        .history-cell.score.winner-cell {
            background-color: rgba(74, 222, 128, 0.03);
        }

        .history-cell.score.loser-cell {
            background-color: rgba(248, 113, 113, 0.03);
        }

        .history-player-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .history-score-text {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .history-daily-summary {
            padding: 16px;
            text-align: center;
            background-color: rgba(34, 211, 238, 0.05);
            border-top: 1px solid var(--border);
            font-weight: 700;
        }

        .history-game-status-mini {
            font-size: 0.6rem;
            margin-top: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        footer {
            padding: 40px 0;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth View -->
        <div id="auth-view" class="fade-in">
            <header>
                <div class="logo">Game On ⚡</div>
            </header>
            <div class="auth-card">
                <div class="auth-toggle">
                    <div id="toggle-login" class="auth-toggle-btn active" onclick="showAuthTab('login')">Login</div>
                    <div id="toggle-register" class="auth-toggle-btn" onclick="showAuthTab('register')">Register</div>
                </div>

                <div id="login-form">
                    <h2>Welcome Back</h2>
                    <input type="text" id="login-username" placeholder="Username">
                    <input type="password" id="login-password" placeholder="Password">
                    <button class="btn-primary" style="width: 100%;" onclick="handleLogin()">Sign In</button>
                </div>

                <div id="register-form" class="hidden">
                    <h2>Create Account</h2>
                    <input type="text" id="reg-username" placeholder="Username">
                    <input type="password" id="reg-password" placeholder="Password">
                    <input type="text" id="reg-invite" placeholder="Invite Code">
                    <button class="btn-primary" style="width: 100%;" onclick="handleRegister()">Register</button>
                </div>
                
                <p id="auth-error" class="hidden" style="color: var(--error); margin-top: 1rem; text-align: center; font-size: 0.9rem;"></p>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden fade-in">
            <header>
                <div class="logo">Game On ⚡</div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="user-display" style="font-weight: 600;"></span>
                    <button class="btn-ghost" onclick="handleLogout()">Logout</button>
                </div>
            </header>

            <div class="date-display" id="current-date"></div>
            <div id="daily-winner" class="hidden daily-winner-banner"></div>

            <div class="game-grid" id="game-cards">
                <!-- Game cards injected by JS -->
            </div>

            <footer>
                <button class="btn-outline" onclick="showHistory()">View History</button>
            </footer>
        </div>

        <!-- History View -->
        <div id="history-view" class="hidden fade-in">
            <header>
                <button class="btn-ghost" onclick="showDashboard()">← Back</button>
                <div class="logo">History</div>
            </header>

            <div id="history-list">
                <!-- History items injected by JS -->
            </div>
        </div>
    </div>

    <!-- Submit Modal -->
    <div id="score-modal" class="modal-overlay hidden">
        <div class="modal-content fade-in">
            <div class="modal-close" onclick="closeModal()">&times;</div>
            <h2 id="modal-game-name">Submit Score</h2>
            <div class="score-section">
                <label class="score-label">Your Result</label>
                <div class="paste-btn-container">
                    <button class="btn-outline" style="flex: 1;" onclick="handlePaste()">📋 Paste from Clipboard</button>
                </div>
                <textarea id="score-result" placeholder="Paste or type your result here..."></textarea>
                <button class="btn-primary" style="width: 100%;" onclick="submitScore()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeGame = null;
        const GAMES = [
            { id: 'tango', name: 'Tango', icon: '🟡' },
            { id: 'zip', name: 'Zip', icon: '🔗' },
            { id: 'queens', name: 'Queens', icon: '👑' },
            { id: 'patches', name: 'Patches', icon: '🧩' }
        ];

        // Auth Tab Toggle
        function showAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const toggleLogin = document.getElementById('toggle-login');
            const toggleReg = document.getElementById('toggle-register');
            const authError = document.getElementById('auth-error');

            authError.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                toggleLogin.classList.add('active');
                toggleReg.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                toggleLogin.classList.remove('active');
                toggleReg.classList.add('active');
            }
        }

        // API Helper
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(endpoint, { ...options, headers });
            
            if (response.status === 401) {
                handleLogout();
                return null;
            }

            return response;
        }

        // Auth Handlers
        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('auth-error');

            if (!username || !password) return;

            try {
                const res = await apiFetch('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    initApp();
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const inviteCode = document.getElementById('reg-invite').value;
            const errorEl = document.getElementById('auth-error');

            if (!username || !password || !inviteCode) return;

            try {
                const res = await apiFetch('/api/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, inviteCode })
                });
                const data = await res.json();

                if (res.ok) {
                    showAuthTab('login');
                    document.getElementById('login-username').value = username;
                    errorEl.textContent = 'Registration successful! Please login.';
                    errorEl.style.color = 'var(--success)';
                    errorEl.classList.remove('hidden');
                } else {
                    errorEl.style.color = 'var(--error)';
                    errorEl.textContent = data.error || 'Registration failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('history-view').classList.add('hidden');
        }

        // Clipboard
        async function handlePaste() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('score-result').value = text;
            } catch (err) {
                alert('Failed to read clipboard. Please paste manually.');
            }
        }

        // Winner Logic
        function parseTimeToSeconds(text) {
            if (!text) return null;
            // Matches M:SS, MM:SS, H:MM:SS
            const timeMatch = text.match(/(\d+):(\d+):(\d+)|(\d+):(\d+)/);
            if (!timeMatch) return null;

            if (timeMatch[4] !== undefined) {
                // M:SS
                return parseInt(timeMatch[4]) * 60 + parseInt(timeMatch[5]);
            } else {
                // H:MM:SS
                return parseInt(timeMatch[1]) * 3600 + parseInt(timeMatch[2]) * 60 + parseInt(timeMatch[3]);
            }
        }

        function determineGameWinner(myText, theirText) {
            const mySec = parseTimeToSeconds(myText);
            const theirSec = parseTimeToSeconds(theirText);

            if (mySec === null || theirSec === null) return null;

            const diff = mySec - theirSec;
            if (Math.abs(diff) <= 1) return 'tie';
            return diff < 0 ? 'mine' : 'theirs';
        }

        // Date Logic for 10 AM Cairo Reset
        function getGameDate() {
            // Cairo is UTC+2 (Standard) or UTC+3 (Summer)
            // LinkedIn games reset at 10 AM Cairo time.
            // We want any time before 10 AM Cairo to count as the previous day.
            
            const now = new Date();
            
            // Convert to Cairo time to determine the current hour there
            const cairoTime = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Africa/Cairo',
                hour: 'numeric',
                hour12: false
            }).format(now);
            
            const cairoHour = parseInt(cairoTime);
            
            // If it's before 10 AM in Cairo, we use yesterday's date
            const resultDate = new Date(now);
            if (cairoHour < 10) {
                resultDate.setDate(resultDate.getDate() - 1);
            }
            
            // Format as YYYY-MM-DD in Cairo's context
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Africa/Cairo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(resultDate);
        }

        // View Logic
        function showDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('history-view').classList.add('hidden');
            loadDashboard();
        }

        function showHistory() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('history-view').classList.remove('hidden');
            loadHistory();
        }

        function openModal(gameId) {
            activeGame = GAMES.find(g => g.id === gameId);
            document.getElementById('modal-game-name').textContent = `Submit ${activeGame.name} Score`;
            document.getElementById('score-result').value = '';
            document.getElementById('score-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('score-modal').classList.add('hidden');
        }

        // Data Loading
        async function loadDashboard() {
            const dateStr = getGameDate();
            
            // For display, we show the "Game Date"
            const gameDateObj = new Date(dateStr + 'T00:00:00');
            const displayDate = gameDateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            document.getElementById('current-date').innerHTML = `${displayDate} <span style="font-size: 0.8rem; opacity: 0.7;">(Reset at 10 AM Cairo)</span>`;
            document.getElementById('user-display').textContent = localStorage.getItem('username');

            const res = await apiFetch(`/api/scores?date=${dateStr}`);
            if (!res) return;
            const data = await res.json();
            const scores = data.scores;
            
            const me = data.users.find(u => u.isMe);
            const friend = data.users.find(u => !u.isMe);
            
            const myName = me ? me.username : 'You';
            const friendName = friend ? friend.username : 'Friend';

            const grid = document.getElementById('game-cards');
            grid.innerHTML = '';

            let myWins = 0;
            let theirWins = 0;
            let gamesCompleted = 0;

            GAMES.forEach(game => {
                const gameData = scores[game.id];
                const card = document.createElement('div');
                card.className = 'game-card';
                
                let myContent = '';
                if (gameData.mine) {
                    myContent = `<div class="score-badge">${gameData.mine.result}</div>`;
                } else {
                    myContent = `<button class="btn-primary" onclick="openModal('${game.id}')">Submit Score</button>`;
                }

                let friendContent = '';
                let statusHtml = '';

                if (gameData.theirs.submitted) {
                    friendContent = `<div class="score-badge" style="background: rgba(34, 211, 238, 0.1); color: var(--accent);">${gameData.theirs.result}</div>`;
                    const gameWinner = determineGameWinner(gameData.mine ? gameData.mine.result : null, gameData.theirs.result);
                    if (gameWinner === 'mine') {
                        myWins++;
                        statusHtml = '<span class="game-status status-win">You won! Waddiii</span>';
                    } else if (gameWinner === 'theirs') {
                        theirWins++;
                        statusHtml = '<span class="game-status status-loss">You lost! Ya loser.</span>';
                    } else if (gameWinner === 'tie') {
                        statusHtml = '<span class="game-status status-tie">We tied! Darb naaar</span>';
                    }
                    gamesCompleted++;
                } else if (gameData.theirs.notYet) {
                    friendContent = `<div class="score-waiting"><span>🔒</span> Scores hidden. Enter yours first.</div>`;
                } else {
                    friendContent = `<div class="score-waiting" style="font-size: 0.8rem;">${friendName} hasn't played yet.</div>`;
                }

                card.innerHTML = `
                    <div class="game-info">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span>${game.icon}</span> ${game.name}
                        </div>
                        ${statusHtml}
                    </div>
                    <div class="score-section">
                        <div class="score-label">${myName}</div>
                        ${myContent}
                    </div>
                    <div class="score-section">
                        <div class="score-label">${friendName}</div>
                        ${friendContent}
                    </div>
                `;
                grid.appendChild(card);
            });

            const dailyWinnerEl = document.getElementById('daily-winner');
            if (gamesCompleted === 4) {
                dailyWinnerEl.classList.remove('hidden');
                if (myWins > theirWins) {
                    dailyWinnerEl.textContent = `🎉 ${myName} is the Daily Winner! (${myWins}-${theirWins})`;
                    dailyWinnerEl.style.color = 'var(--success)';
                } else if (theirWins > myWins) {
                    dailyWinnerEl.textContent = `💀 ${friendName} is the Daily Winner... (${theirWins}-${myWins})`;
                    dailyWinnerEl.style.color = 'var(--error)';
                } else {
                    dailyWinnerEl.textContent = `🤝 It's a Daily Tie! (${myWins}-${theirWins})`;
                    dailyWinnerEl.style.color = 'var(--accent)';
                }
            } else {
                dailyWinnerEl.classList.add('hidden');
            }
        }

        async function submitScore() {
            const result = document.getElementById('score-result').value;
            if (!result) return;

            // Verification Step
            const trimmedResult = result.trim();
            const firstWord = trimmedResult.split(/\s+|#|\|/)[0].toLowerCase();
            const correctName = activeGame.name.toLowerCase();

            // Special case for "Tango" which might be "LinkedIn Tango" or similar
            // We check if the result starts with the game name
            if (!trimmedResult.toLowerCase().startsWith(correctName)) {
                // Try to extract what they actually entered
                const detectedName = firstWord.charAt(0).toUpperCase() + firstWord.slice(1);
                alert(`You're trying to enter the score of ${detectedName} in the field of ${activeGame.name}. Es7aaaaaa. Foooooo2.`);
                return;
            }

            const dateStr = getGameDate();

            const res = await apiFetch('/api/scores', {
                method: 'POST',
                body: JSON.stringify({
                    game: activeGame.id,
                    result,
                    score_date: dateStr
                })
            });

            if (res && res.ok) {
                closeModal();
                loadDashboard();
            } else {
                const data = await res.json();
                alert(data.error || 'Failed to submit score');
            }
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<p style="text-align: center; color: var(--text-dim);">Loading history...</p>';

            const res = await apiFetch('/api/history');
            if (!res) return;
            const data = await res.json();
            const history = data.days;
            
            const me = data.users.find(u => u.isMe);
            const friend = data.users.find(u => !u.isMe);
            
            const myName = me ? me.username : 'You';
            const friendName = friend ? friend.username : 'Friend';

            list.innerHTML = '';
            const dates = Object.keys(history).sort().reverse();

            if (dates.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-dim); margin-top: 2rem;">No scores yet. Get playing!</p>';
                return;
            }

            dates.forEach(date => {
                const dateObj = new Date(date + 'T00:00:00');
                const dateDisplay = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                const group = document.createElement('div');
                group.className = 'history-date-group';
                
                let myDailyWins = 0;
                let theirDailyWins = 0;
                let gamesCompleted = 0;

                let tableHtml = '<div class="history-table">';

                GAMES.forEach(game => {
                    const gameData = history[date][game.id];
                    if (!gameData.mine && !gameData.theirs.submitted) return;

                    const myRes = gameData.mine ? gameData.mine.result : '—';
                    const theirRes = gameData.theirs.submitted ? gameData.theirs.result : '🔒';

                    let statusText = '';
                    let myClass = '';
                    let theirClass = '';

                    if (gameData.theirs.submitted) {
                        const gameWinner = determineGameWinner(gameData.mine ? gameData.mine.result : null, gameData.theirs.result);
                        if (gameWinner === 'mine') {
                            myDailyWins++;
                            statusText = 'You won! Waddiii';
                            myClass = 'winner-cell';
                            theirClass = 'loser-cell';
                        } else if (gameWinner === 'theirs') {
                            theirDailyWins++;
                            statusText = 'You lost! Ya loser.';
                            myClass = 'loser-cell';
                            theirClass = 'winner-cell';
                        } else if (gameWinner === 'tie') {
                            statusText = 'We tied! Darb naaar';
                        }
                        gamesCompleted++;
                    }

                    tableHtml += `
                        <div class="history-row">
                            <div class="history-cell game-name">
                                <div>${game.icon} ${game.name}</div>
                                <div class="history-game-status-mini" style="color: ${statusText.includes('won') ? 'var(--success)' : statusText.includes('lost') ? 'var(--error)' : 'var(--accent)'}">${statusText}</div>
                            </div>
                            <div class="history-cell score ${myClass}">
                                <div class="history-player-label">${myName}</div>
                                <div class="history-score-text">${myRes}</div>
                            </div>
                            <div class="history-cell score ${theirClass}">
                                <div class="history-player-label">${friendName}</div>
                                <div class="history-score-text">${theirRes}</div>
                            </div>
                        </div>
                    `;
                });

                tableHtml += '</div>';

                let summaryHtml = '';
                if (gamesCompleted === 4) {
                    let summaryText = '';
                    let summaryColor = '';
                    if (myDailyWins > theirDailyWins) {
                        summaryText = `🎉 ${myName} is the Daily Winner! (${myDailyWins}-${theirDailyWins})`;
                        summaryColor = 'var(--success)';
                    } else if (theirDailyWins > myDailyWins) {
                        summaryText = `💀 ${friendName} is the Daily Winner... (${theirDailyWins}-${myDailyWins})`;
                        summaryColor = 'var(--error)';
                    } else {
                        summaryText = `🤝 It's a Daily Tie! (${myDailyWins}-${theirDailyWins})`;
                        summaryColor = 'var(--accent)';
                    }
                    summaryHtml = `<div class="history-daily-summary" style="color: ${summaryColor}">${summaryText}</div>`;
                }

                group.innerHTML = `
                    <div class="history-date-header">
                        <span>${dateDisplay}</span>
                        <span style="color: var(--text-dim); font-size: 0.8rem; font-weight: 400;">${gamesCompleted}/4 Games</span>
                    </div>
                    ${tableHtml}
                    ${summaryHtml}
                `;
                list.appendChild(group);
            });
        }

        // Init
        function initApp() {
            const token = localStorage.getItem('token');
            if (token) {
                showDashboard();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('history-view').classList.add('hidden');
            }
        }

        initApp();
    </script>
</body>
</html>
