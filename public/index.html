<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On ⚡ Score Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22d3ee;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #4ade80;
            --error: #f87171;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
            flex: 1;
        }

        /* Utils */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography */
        h1 { font-size: 2rem; font-weight: 700; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
        .text-accent { color: var(--accent); }

        /* Buttons */
        button, .btn {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn-outline:hover {
            background: rgba(34, 211, 238, 0.1);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
        }

        .btn-ghost:hover {
            color: var(--text-main);
        }

        /* Inputs */
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 1rem;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            min-height: 100px;
        }

        .paste-btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .daily-winner-banner {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), rgba(74, 222, 128, 0.1));
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .logo { font-size: 1.25rem; font-weight: 700; }

        /* Auth Screen */
        .auth-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 50px;
        }

        .auth-toggle {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .auth-toggle-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }

        .auth-toggle-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Dashboard */
        .date-display {
            color: var(--text-dim);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 600;
        }

        .game-status {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-win { background: rgba(74, 222, 128, 0.2); color: var(--success); }
        .status-loss { background: rgba(248, 113, 113, 0.2); color: var(--error); }
        .status-tie { background: rgba(34, 211, 238, 0.2); color: var(--accent); }

        .score-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-badge {
            background-color: rgba(74, 222, 128, 0.1);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        /* Ensure friend override still works */
        .game-card .score-badge[style*="color: var(--accent)"] {
            color: var(--accent) !important;
        }

        .score-waiting {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-style: italic;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* History Redesign */
        .history-date-group {
            margin-bottom: 32px;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .history-date-header {
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-row {
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            display: grid;
            grid-template-columns: 100px 1fr 1fr;
        }

        .history-row:last-child {
            border-bottom: none;
        }

        .history-cell {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .history-cell.game-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            background-color: rgba(255, 255, 255, 0.01);
        }

        .history-cell.score {
            gap: 4px;
        }

        .history-cell.score.winner-cell {
            background-color: rgba(74, 222, 128, 0.03);
        }

        .history-cell.score.loser-cell {
            background-color: rgba(248, 113, 113, 0.03);
        }

        .history-player-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .history-score-text {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .score-highlight {
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .history-daily-summary {
            padding: 16px;
            text-align: center;
            background-color: rgba(34, 211, 238, 0.05);
            border-top: 1px solid var(--border);
            font-weight: 700;
        }

        .history-game-status-mini {
            font-size: 0.6rem;
            margin-top: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        footer {
            padding: 40px 0;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth View -->
        <div id="auth-view" class="fade-in">
            <header>
                <div class="logo">Game On ⚡</div>
            </header>
            <div class="auth-card">
                <div class="auth-toggle">
                    <div id="toggle-login" class="auth-toggle-btn active" onclick="showAuthTab('login')">Login</div>
                    <div id="toggle-register" class="auth-toggle-btn" onclick="showAuthTab('register')">Register</div>
                </div>

                <div id="login-form">
                    <h2>Welcome Back</h2>
                    <input type="text" id="login-username" placeholder="Username">
                    <input type="password" id="login-password" placeholder="Password">
                    <button class="btn-primary" style="width: 100%;" onclick="handleLogin()">Sign In</button>
                </div>

                <div id="register-form" class="hidden">
                    <h2>Create Account</h2>
                    <input type="text" id="reg-username" placeholder="Username">
                    <input type="password" id="reg-password" placeholder="Password">
                    <input type="text" id="reg-invite" placeholder="Invite Code">
                    <button class="btn-primary" style="width: 100%;" onclick="handleRegister()">Register</button>
                </div>
                
                <p id="auth-error" class="hidden" style="color: var(--error); margin-top: 1rem; text-align: center; font-size: 0.9rem;"></p>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden fade-in">
            <header>
                <div class="logo">Game On ⚡</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn-ghost" style="padding: 6px 10px; font-size: 0.8rem;" onclick="showHistory()">History</button>
                    <button class="btn-ghost" style="padding: 6px 10px; font-size: 0.8rem;" onclick="showStats()">Stats</button>
                    <button class="btn-ghost" style="padding: 6px 10px; font-size: 0.8rem; color: var(--error);" onclick="handleLogout()">Logout</button>
                </div>
            </header>

            <div class="date-display" id="current-date"></div>
            <div id="daily-winner" class="hidden daily-winner-banner"></div>

            <div class="game-grid" id="game-cards">
                <!-- Game cards injected by JS -->
            </div>
        </div>

        <!-- History View -->
        <div id="history-view" class="hidden fade-in">
            <header>
                <button class="btn-ghost" onclick="showDashboard()">← Back</button>
                <div class="logo">History</div>
            </header>

            <div id="history-list">
                <!-- History items injected by JS -->
            </div>
        </div>

        <!-- Stats View -->
        <div id="stats-view" class="hidden fade-in">
            <header>
                <button class="btn-ghost" onclick="showDashboard()">← Back</button>
                <div class="logo">Statistics</div>
            </header>

            <div class="auth-toggle" style="margin-bottom: 24px;">
                <div id="stats-filter-all" class="auth-toggle-btn active" onclick="loadStats('all')">All Time</div>
                <div id="stats-filter-month" class="auth-toggle-btn" onclick="loadStats('month')">This Month</div>
                <div id="stats-filter-week" class="auth-toggle-btn" onclick="loadStats('week')">This Week</div>
            </div>

            <div id="stats-content">
                <!-- Stats injected by JS -->
            </div>
        </div>
    </div>

    <!-- Submit Modal -->
    <div id="score-modal" class="modal-overlay hidden">
        <div class="modal-content fade-in">
            <div class="modal-close" onclick="closeModal()">&times;</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                <h2 id="modal-game-name" style="margin-bottom: 0;">Submit Score</h2>
                <a id="modal-play-link" href="#" target="_blank" class="btn-ghost" style="padding: 4px 8px; font-size: 0.8rem; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--accent);">Play Game ↗</a>
            </div>
            <div class="score-section">
                <label class="score-label">Your Result</label>
                <div class="paste-btn-container">
                    <button class="btn-outline" style="flex: 1;" onclick="handlePaste()">📋 Paste from Clipboard</button>
                </div>
                <textarea id="score-result" placeholder="Paste or type your result here..."></textarea>
                <button class="btn-primary" style="width: 100%;" onclick="submitScore()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeGame = null;
        const GAMES = [
            { id: 'tango', name: 'Tango', icon: '🟡', url: 'https://www.linkedin.com/games/tango' },
            { id: 'zip', name: 'Zip', icon: '🔗', url: 'https://www.linkedin.com/games/zip' },
            { id: 'queens', name: 'Queens', icon: '👑', url: 'https://www.linkedin.com/games/queens' },
            { id: 'patches', name: 'Patches', icon: '🧩', url: 'https://www.linkedin.com/games/patches' }
        ];

        // Auth Tab Toggle
        function showAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const toggleLogin = document.getElementById('toggle-login');
            const toggleReg = document.getElementById('toggle-register');
            const authError = document.getElementById('auth-error');

            authError.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                toggleLogin.classList.add('active');
                toggleReg.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                toggleLogin.classList.remove('active');
                toggleReg.classList.add('active');
            }
        }

        // API Helper
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(endpoint, { ...options, headers });
            
            if (response.status === 401) {
                handleLogout();
                return null;
            }

            return response;
        }

        // Auth Handlers
        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('auth-error');

            if (!username || !password) return;

            try {
                const res = await apiFetch('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    initApp();
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const inviteCode = document.getElementById('reg-invite').value;
            const errorEl = document.getElementById('auth-error');

            if (!username || !password || !inviteCode) return;

            try {
                const res = await apiFetch('/api/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, inviteCode })
                });
                const data = await res.json();

                if (res.ok) {
                    showAuthTab('login');
                    document.getElementById('login-username').value = username;
                    errorEl.textContent = 'Registration successful! Please login.';
                    errorEl.style.color = 'var(--success)';
                    errorEl.classList.remove('hidden');
                } else {
                    errorEl.style.color = 'var(--error)';
                    errorEl.textContent = data.error || 'Registration failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('history-view').classList.add('hidden');
        }

        // Clipboard
        async function handlePaste() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('score-result').value = text;
            } catch (err) {
                alert('Failed to read clipboard. Please paste manually.');
            }
        }

        // Winner Logic
        function parseTimeToSeconds(text) {
            if (!text) return null;
            // Matches M:SS, MM:SS, H:MM:SS
            const timeMatch = text.match(/(\d+):(\d+):(\d+)|(\d+):(\d+)/);
            if (!timeMatch) return null;

            if (timeMatch[4] !== undefined) {
                // M:SS
                return parseInt(timeMatch[4]) * 60 + parseInt(timeMatch[5]);
            } else {
                // H:MM:SS
                return parseInt(timeMatch[1]) * 3600 + parseInt(timeMatch[2]) * 60 + parseInt(timeMatch[3]);
            }
        }

        function determineGameWinner(myText, theirText) {
            const mySec = parseTimeToSeconds(myText);
            const theirSec = parseTimeToSeconds(theirText);

            if (mySec === null || theirSec === null) return null;

            const diff = mySec - theirSec;
            if (Math.abs(diff) <= 1) return 'tie';
            return diff < 0 ? 'mine' : 'theirs';
        }

        // Date Logic for 10 AM Cairo Reset
        function getGameDate() {
            // Cairo is UTC+2 (Standard) or UTC+3 (Summer)
            // LinkedIn games reset at 10 AM Cairo time.
            // We want any time before 10 AM Cairo to count as the previous day.
            
            const now = new Date();
            
            // Convert to Cairo time to determine the current hour there
            const cairoTime = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Africa/Cairo',
                hour: 'numeric',
                hour12: false
            }).format(now);
            
            const cairoHour = parseInt(cairoTime);
            
            // If it's before 10 AM in Cairo, we use yesterday's date
            const resultDate = new Date(now);
            if (cairoHour < 10) {
                resultDate.setDate(resultDate.getDate() - 1);
            }
            
            // Format as YYYY-MM-DD in Cairo's context
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Africa/Cairo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(resultDate);
        }

        // View Logic
        function showDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('stats-view').classList.add('hidden');
            document.getElementById('stats-content').innerHTML = '';
            loadDashboard();
        }

        function showHistory() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('history-view').classList.remove('hidden');
            document.getElementById('stats-view').classList.add('hidden');
            loadHistory();
        }

        function showStats() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('stats-view').classList.remove('hidden');
            loadStats('all');
        }

        function formatTime(seconds) {
            if (seconds === null || isNaN(seconds)) return '—';
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function loadStats(filter) {
            // Update UI filter tabs
            ['all', 'month', 'week'].forEach(f => {
                document.getElementById(`stats-filter-${f}`).classList.toggle('active', f === filter);
            });

            const content = document.getElementById('stats-content');
            content.innerHTML = '<p style="text-align: center; color: var(--text-dim);">Calculating stats...</p>';

            // We use the history endpoint to get all data and filter locally
            const res = await apiFetch('/api/history');
            if (!res) return;
            const data = await res.json();
            const history = data.days;
            
            const me = data.users.find(u => u.isMe);
            const friend = data.users.find(u => !u.isMe);
            const myName = me ? me.username : 'You';
            const friendName = friend ? friend.username : 'Friend';

            // Filter logic (Respecting 10 AM Cairo reset)
            const now = new Date();
            
            // Helper to get 10 AM Cairo on a specific date
            const getCairo10AM = (d) => {
                const date = new Date(d);
                // We simplify by using local time as a proxy, 
                // but since the game date logic uses Cairo, we align stats here.
                date.setHours(10, 0, 0, 0);
                return date;
            };

            let cutoffDate = null;

            if (filter === 'month') {
                const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                cutoffDate = getCairo10AM(firstOfMonth);
                // If it's the 1st but before 10 AM, we should ideally go to the previous month,
                // but usually "This Month" implies the current calendar month's cycle.
            } else if (filter === 'week') {
                const dayOfWeek = now.getDay(); // 0-Sun, 6-Sat
                // Days since most recent Saturday
                let daysSinceSat = (dayOfWeek + 1) % 7; 
                
                const satDate = new Date(now);
                satDate.setDate(now.getDate() - daysSinceSat);
                cutoffDate = getCairo10AM(satDate);

                // Special case: If today is Saturday and it's before 10 AM, 
                // the "Current Week" cycle actually started last Saturday.
                if (dayOfWeek === 6) {
                    const cairoTime = new Intl.DateTimeFormat('en-US', {
                        timeZone: 'Africa/Cairo',
                        hour: 'numeric',
                        hour12: false
                    }).format(now);
                    if (parseInt(cairoTime) < 10) {
                        cutoffDate.setDate(cutoffDate.getDate() - 7);
                    }
                }
            }

            // Convert cutoff to YYYY-MM-DD for string comparison with history keys
            const cutoffStr = cutoffDate ? new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Africa/Cairo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(cutoffDate) : null;

            let stats = {
                dailyWins: { me: 0, friend: 0, ties: 0 },
                games: {}, // breakdown by game
            };

            GAMES.forEach(g => {
                stats.games[g.id] = { 
                    wins: { me: 0, friend: 0, ties: 0 }, 
                    times: { me: [], friend: [] },
                    diffs: [],
                    records: { 
                        me: { score: null, date: null }, 
                        friend: { score: null, date: null } 
                    }
                };
            });

            const dates = Object.keys(history).sort();
            dates.forEach(dateStr => {
                const day = history[dateStr];
                let dayWins = { me: 0, friend: 0, completed: 0 };

                GAMES.forEach(game => {
                    const gData = day[game.id];
                    if (!gData) return;

                    // Apply filter
                    if (filter !== 'all' && dateStr < cutoffStr) return;

                    // Parse times for records
                    if (gData.mine) {
                        const mySec = parseTimeToSeconds(gData.mine.result);
                        if (mySec !== null) {
                            if (stats.games[game.id].records.me.score === null || mySec < stats.games[game.id].records.me.score) {
                                stats.games[game.id].records.me.score = mySec;
                                stats.games[game.id].records.me.date = dateStr;
                            }
                        }
                    }
                    if (gData.theirs.submitted) {
                        const theirSec = parseTimeToSeconds(gData.theirs.result);
                        if (theirSec !== null) {
                            if (stats.games[game.id].records.friend.score === null || theirSec < stats.games[game.id].records.friend.score) {
                                stats.games[game.id].records.friend.score = theirSec;
                                stats.games[game.id].records.friend.date = dateStr;
                            }
                        }
                    }

                    if (!gData.mine || !gData.theirs.submitted) return;

                    const mySec = parseTimeToSeconds(gData.mine.result);
                    const theirSec = parseTimeToSeconds(gData.theirs.result);

                    if (mySec !== null && theirSec !== null) {
                        stats.games[game.id].times.me.push(mySec);
                        stats.games[game.id].times.friend.push(theirSec);
                        stats.games[game.id].diffs.push(mySec - theirSec);
                    }

                    const winner = determineGameWinner(gData.mine.result, gData.theirs.result);
                    if (winner === 'mine') {
                        stats.games[game.id].wins.me++;
                        dayWins.me++;
                    } else if (winner === 'theirs') {
                        stats.games[game.id].wins.friend++;
                        dayWins.friend++;
                    } else if (winner === 'tie') {
                        stats.games[game.id].wins.ties++;
                    }
                    dayWins.completed++;
                });

                // Calculate daily winner only if within filter
                if (filter === 'all' || dateStr >= cutoffStr) {
                    if (dayWins.completed === 4) {
                        if (dayWins.me > dayWins.friend) stats.dailyWins.me++;
                        else if (dayWins.friend > dayWins.me) stats.dailyWins.friend++;
                        else stats.dailyWins.ties++;
                    }
                }
            });

            // Build HTML
            let html = `
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                    <div class="game-card" style="text-align: center; padding: 15px;">
                        <div class="score-label">${myName}</div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--success);">${stats.dailyWins.me}</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">DAILY WINS</div>
                    </div>
                    <div class="game-card" style="text-align: center; padding: 15px;">
                        <div class="score-label">TIES</div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">${stats.dailyWins.ties}</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">DAILY DRAWS</div>
                    </div>
                    <div class="game-card" style="text-align: center; padding: 15px;">
                        <div class="score-label">${friendName}</div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--error);">${stats.dailyWins.friend}</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">DAILY WINS</div>
                    </div>
                </div>
                <p style="text-align: center; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 24px;">(Daily wins count days where all 4 games were played)</p>

                <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Game Breakdown</h2>
            `;

            GAMES.forEach(game => {
                const gStats = stats.games[game.id];
                const myAvg = gStats.times.me.length ? gStats.times.me.reduce((a, b) => a + b) / gStats.times.me.length : null;
                const theirAvg = gStats.times.friend.length ? gStats.times.friend.reduce((a, b) => a + b) / gStats.times.friend.length : null;
                const avgDiff = gStats.diffs.length ? gStats.diffs.reduce((a, b) => a + b) / gStats.diffs.length : 0;

                html += `
                    <div style="margin-bottom: 32px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-left: 4px;">
                            <span style="font-size: 1.4rem;">${game.icon}</span>
                            <h2 style="font-size: 1.2rem; margin-bottom: 0;">${game.name}</h2>
                            <span style="font-size: 0.8rem; color: var(--text-dim); margin-left: auto;">${gStats.wins.me + gStats.wins.friend + gStats.wins.ties} games</span>
                        </div>

                        <!-- Mini Win Summary -->
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                            <div class="game-card" style="text-align: center; padding: 10px; border-color: rgba(74, 222, 128, 0.2);">
                                <div class="score-label" style="font-size: 0.6rem;">${myName}</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--success);">${gStats.wins.me}</div>
                            </div>
                            <div class="game-card" style="text-align: center; padding: 10px; border-color: rgba(34, 211, 238, 0.2);">
                                <div class="score-label" style="font-size: 0.6rem;">TIES</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent);">${gStats.wins.ties}</div>
                            </div>
                            <div class="game-card" style="text-align: center; padding: 10px; border-color: rgba(248, 113, 113, 0.2);">
                                <div class="score-label" style="font-size: 0.6rem;">${friendName}</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--error);">${gStats.wins.friend}</div>
                            </div>
                        </div>

                        <!-- Mini Averages Summary -->
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                            <div class="game-card" style="text-align: center; padding: 8px; background: transparent; border-style: dashed;">
                                <div class="score-label" style="font-size: 0.55rem;">MY AVG</div>
                                <div style="font-size: 0.85rem; font-weight: 600;">${formatTime(myAvg)}</div>
                            </div>
                            <div class="game-card" style="text-align: center; padding: 8px; background: rgba(255,255,255,0.02); border-color: var(--border);">
                                <div class="score-label" style="font-size: 0.55rem;">AVG DIFF</div>
                                <div style="font-size: 0.85rem; font-weight: 700; color: ${avgDiff < 0 ? 'var(--success)' : avgDiff > 0 ? 'var(--error)' : 'var(--text-main)'};">
                                    ${avgDiff < 0 ? '-' : avgDiff > 0 ? '+' : ''}${formatTime(Math.abs(avgDiff))}
                                </div>
                            </div>
                            <div class="game-card" style="text-align: center; padding: 8px; background: transparent; border-style: dashed;">
                                <div class="score-label" style="font-size: 0.55rem;">THEIR AVG</div>
                                <div style="font-size: 0.85rem; font-weight: 600;">${formatTime(theirAvg)}</div>
                            </div>
                        </div>

                        <!-- Personal Records Summary -->
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div class="game-card" style="text-align: center; padding: 8px; border-color: rgba(74, 222, 128, 0.4); background: linear-gradient(135deg, rgba(74, 222, 128, 0.05), transparent);">
                                <div class="score-label" style="font-size: 0.55rem; color: var(--success); text-transform: uppercase;">${myName}'S PERSONAL RECORD</div>
                                <div style="font-size: 0.9rem; font-weight: 800; color: var(--success);">${formatTime(gStats.records.me.score)}</div>
                                <div style="font-size: 0.6rem; color: var(--text-dim); margin-top: 2px;">${gStats.records.me.date ? new Date(gStats.records.me.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'}</div>
                            </div>
                            <div class="game-card" style="text-align: center; padding: 8px; border-color: rgba(248, 113, 113, 0.4); background: linear-gradient(135deg, rgba(248, 113, 113, 0.05), transparent);">
                                <div class="score-label" style="font-size: 0.55rem; color: var(--error); text-transform: uppercase;">${friendName}'S PERSONAL RECORD</div>
                                <div style="font-size: 0.9rem; font-weight: 800; color: var(--error);">${formatTime(gStats.records.friend.score)}</div>
                                <div style="font-size: 0.6rem; color: var(--text-dim); margin-top: 2px;">${gStats.records.friend.date ? new Date(gStats.records.friend.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
        }

        function openModal(gameId, existingResult = '') {
            activeGame = GAMES.find(g => g.id === gameId);
            document.getElementById('modal-game-name').textContent = existingResult ? `Edit ${activeGame.name} Score` : `Submit ${activeGame.name} Score`;
            document.getElementById('modal-play-link').href = activeGame.url;
            document.getElementById('score-result').value = existingResult;
            document.getElementById('score-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('score-modal').classList.add('hidden');
        }

        // UI Formatting
        function simplifyScore(text) {
            if (!text) return '—';
            // Regex for time: M:SS, MM:SS, H:MM:SS
            const timeRegex = /(\d+:\d+(?::\d+)?)/;
            const match = text.match(timeRegex);
            if (match) return match[1];

            // For Patches, might be "X moves"
            const movesMatch = text.match(/(\d+)\s*moves/i);
            if (movesMatch) return movesMatch[1] + ' moves';

            // Fallback to first line if no specific match
            return text.split('\n')[0];
        }

        function formatScore(text) {
            if (!text) return '';
            
            // Regex for time: M:SS, MM:SS, H:MM:SS
            const timeRegex = /(\d+:\d+(?::\d+)?)/;
            
            const lines = text.split('\n');
            const firstLine = lines[0];
            
            // Highlight time in the first line if found
            const highlightedFirstLine = firstLine.replace(timeRegex, '<span class="score-highlight">$1</span>');
            
            if (lines.length === 1) return highlightedFirstLine;
            
            return highlightedFirstLine + '\n' + lines.slice(1).join('\n');
        }

        // Data Loading
        async function loadDashboard() {
            const dateStr = getGameDate();
            
            // For display, we show the "Game Date"
            const gameDateObj = new Date(dateStr + 'T00:00:00');
            const displayDate = gameDateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            document.getElementById('current-date').innerHTML = `${displayDate} <span style="font-size: 0.8rem; opacity: 0.7;">(Reset at 10 AM Cairo)</span>`;

            const res = await apiFetch(`/api/scores?date=${dateStr}`);
            if (!res) return;
            const data = await res.json();
            const scores = data.scores;
            
            const me = data.users.find(u => u.isMe);
            const friend = data.users.find(u => !u.isMe);
            
            const myName = me ? me.username : 'You';
            const friendName = friend ? friend.username : 'Friend';

            const grid = document.getElementById('game-cards');
            grid.innerHTML = '';

            let myWins = 0;
            let theirWins = 0;
            let gamesCompleted = 0;

            GAMES.forEach(game => {
                const gameData = scores[game.id];
                const card = document.createElement('div');
                card.className = 'game-card';
                
                let myContent = '';
                if (gameData.mine) {
                    // Escape single quotes in result for the onclick handler
                    const escapedResult = gameData.mine.result.replace(/'/g, "\\'");
                    myContent = `
                        <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
                            <div class="score-badge" style="color: var(--success)">${formatScore(gameData.mine.result)}</div>
                            <button class="btn-ghost" style="font-size: 0.7rem; padding: 4px; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; width: 100%;" onclick="openModal('${game.id}', '${escapedResult}')">✎ Edit Score</button>
                        </div>
                    `;
                } else {
                    myContent = `<button class="btn-primary" onclick="openModal('${game.id}')">Submit Score</button>`;
                }

                let friendContent = '';
                let statusHtml = '';

                if (gameData.theirs.submitted) {
                    friendContent = `<div class="score-badge" style="background: rgba(34, 211, 238, 0.1); color: var(--accent);">${formatScore(gameData.theirs.result)}</div>`;
                    const gameWinner = determineGameWinner(gameData.mine ? gameData.mine.result : null, gameData.theirs.result);
                    if (gameWinner === 'mine') {
                        myWins++;
                        statusHtml = '<span class="game-status status-win">You won! Waddiii</span>';
                    } else if (gameWinner === 'theirs') {
                        theirWins++;
                        statusHtml = '<span class="game-status status-loss">You lost! Ya loser.</span>';
                    } else if (gameWinner === 'tie') {
                        statusHtml = '<span class="game-status status-tie">We tied! Darb naaar</span>';
                    }
                    gamesCompleted++;
                } else if (gameData.theirs.notYet) {
                    friendContent = `<div class="score-waiting"><span>🔒</span> Scores hidden. Enter yours first.</div>`;
                } else {
                    friendContent = `<div class="score-waiting" style="font-size: 0.8rem;">${friendName} hasn't played yet.</div>`;
                }

                card.innerHTML = `
                    <div class="game-info">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span>${game.icon}</span> ${game.name}
                        </div>
                        ${statusHtml}
                    </div>
                    <a href="${game.url}" target="_blank" class="btn btn-primary">
                        Play Game ↗
                    </a>
                    <div class="score-section">
                        <div class="score-label">${myName}</div>
                        ${myContent}
                    </div>
                    <div class="score-section">
                        <div class="score-label">${friendName}</div>
                        ${friendContent}
                    </div>
                `;
                grid.appendChild(card);
            });

            const dailyWinnerEl = document.getElementById('daily-winner');
            if (gamesCompleted === 4) {
                dailyWinnerEl.classList.remove('hidden');
                if (myWins > theirWins) {
                    dailyWinnerEl.textContent = `🎉 ${myName} howa el papa ennaharda! (${myWins}-${theirWins})`;
                    dailyWinnerEl.style.color = 'var(--success)';
                } else if (theirWins > myWins) {
                    dailyWinnerEl.textContent = `💀 ${friendName} howa el papa ennaharda... (${theirWins}-${myWins})`;
                    dailyWinnerEl.style.color = 'var(--error)';
                } else {
                    dailyWinnerEl.textContent = `🤝 Ta3adol ya sh2ee2! (${myWins}-${theirWins})`;
                    dailyWinnerEl.style.color = 'var(--accent)';
                }
            } else {
                dailyWinnerEl.classList.add('hidden');
            }
        }

        async function submitScore() {
            const result = document.getElementById('score-result').value;
            if (!result) return;

            // Verification Step
            const trimmedResult = result.trim();
            const firstWord = trimmedResult.split(/\s+|#|\|/)[0].toLowerCase();
            const correctName = activeGame.name.toLowerCase();

            // Special case for "Tango" which might be "LinkedIn Tango" or similar
            // We check if the result starts with the game name
            if (!trimmedResult.toLowerCase().startsWith(correctName)) {
                // Try to extract what they actually entered
                const detectedName = firstWord.charAt(0).toUpperCase() + firstWord.slice(1);
                alert(`You're trying to enter the score of ${detectedName} in the field of ${activeGame.name}. Es7aaaaaa. Foooooo2.`);
                return;
            }

            const dateStr = getGameDate();

            const res = await apiFetch('/api/scores', {
                method: 'POST',
                body: JSON.stringify({
                    game: activeGame.id,
                    result,
                    score_date: dateStr
                })
            });

            if (res && res.ok) {
                closeModal();
                loadDashboard();
            } else {
                const data = await res.json();
                alert(data.error || 'Failed to submit score');
            }
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<p style="text-align: center; color: var(--text-dim);">Loading history...</p>';

            const res = await apiFetch('/api/history');
            if (!res) return;
            const data = await res.json();
            const history = data.days;
            
            const me = data.users.find(u => u.isMe);
            const friend = data.users.find(u => !u.isMe);
            
            const myName = me ? me.username : 'You';
            const friendName = friend ? friend.username : 'Friend';

            list.innerHTML = '';
            const dates = Object.keys(history).sort().reverse();

            if (dates.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-dim); margin-top: 2rem;">No scores yet. Get playing!</p>';
                return;
            }

            dates.forEach(date => {
                const dateObj = new Date(date + 'T00:00:00');
                const dateDisplay = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                const group = document.createElement('div');
                group.className = 'history-date-group';
                
                let myDailyWins = 0;
                let theirDailyWins = 0;
                let gamesCompleted = 0;

                let tableHtml = '<div class="history-table">';

                GAMES.forEach(game => {
                    const gameData = history[date][game.id];
                    if (!gameData.mine && !gameData.theirs.submitted) return;

                    const myRes = gameData.mine ? simplifyScore(gameData.mine.result) : '—';
                    const theirRes = gameData.theirs.submitted ? simplifyScore(gameData.theirs.result) : '🔒';

                    let winnerName = '';
                    let myClass = '';
                    let theirClass = '';

                    if (gameData.theirs.submitted) {
                        const gameWinner = determineGameWinner(gameData.mine ? gameData.mine.result : null, gameData.theirs.result);
                        if (gameWinner === 'mine') {
                            myDailyWins++;
                            winnerName = myName;
                            myClass = 'winner-cell';
                            theirClass = 'loser-cell';
                        } else if (gameWinner === 'theirs') {
                            theirDailyWins++;
                            winnerName = friendName;
                            myClass = 'loser-cell';
                            theirClass = 'winner-cell';
                        } else if (gameWinner === 'tie') {
                            winnerName = 'Tie';
                        }
                        gamesCompleted++;
                    }

                    tableHtml += `
                        <div class="history-row">
                            <div class="history-cell game-name">
                                <div>${game.icon} ${game.name}</div>
                                <div class="history-game-status-mini" style="color: ${winnerName === myName ? 'var(--success)' : winnerName === friendName ? 'var(--error)' : 'var(--accent)'}">${winnerName}</div>
                            </div>
                            <div class="history-cell score ${myClass}">
                                <div class="history-player-label">${myName}</div>
                                <div class="history-score-text">${myRes}</div>
                            </div>
                            <div class="history-cell score ${theirClass}">
                                <div class="history-player-label">${friendName}</div>
                                <div class="history-score-text">${theirRes}</div>
                            </div>
                        </div>
                    `;
                });

                tableHtml += '</div>';

                let summaryHtml = '';
                if (gamesCompleted === 4) {
                    let summaryText = '';
                    let summaryColor = '';
                    if (myDailyWins > theirDailyWins) {
                        summaryText = `${myName} won - (${myDailyWins}-${theirDailyWins})`;
                        summaryColor = 'var(--success)';
                    } else if (theirDailyWins > myDailyWins) {
                        summaryText = `${friendName} won - (${theirDailyWins}-${myDailyWins})`;
                        summaryColor = 'var(--error)';
                    } else {
                        summaryText = `Tie - (${myDailyWins}-${theirDailyWins})`;
                        summaryColor = 'var(--accent)';
                    }
                    summaryHtml = `<div class="history-daily-summary" style="color: ${summaryColor}">${summaryText}</div>`;
                }

                group.innerHTML = `
                    <div class="history-date-header">
                        <span>${dateDisplay}</span>
                        <span style="color: var(--text-dim); font-size: 0.8rem; font-weight: 400;">${gamesCompleted}/4 Games</span>
                    </div>
                    ${tableHtml}
                    ${summaryHtml}
                `;
                list.appendChild(group);
            });
        }

        // Init
        function initApp() {
            const token = localStorage.getItem('token');
            if (token) {
                showDashboard();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('history-view').classList.add('hidden');
            }
        }

        initApp();
    </script>
</body>
</html>
